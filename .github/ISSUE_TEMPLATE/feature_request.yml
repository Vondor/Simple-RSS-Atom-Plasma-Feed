name: Feature request
description: An idea for something new or different.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and why?
      description: The widget is meant to stay simple and needs no extra packages (see AGENTS.md, Non-goals). Big extensions of its functions may be rejected; bug fixes are always welcome.
    validations:
      required: true
  - type: input
    id: made-by
    attributes:
      label: "If an AI wrote this issue: tool and model"
      description: 'Leave empty if you wrote it yourself. Otherwise name the tool and the model, for example "Example Assistant (model-name 1.2)". Issues from the project''s outside AI reviewers also get the label `outside-review` (AGENTS.md 7.4).'
    validations:
      required: false

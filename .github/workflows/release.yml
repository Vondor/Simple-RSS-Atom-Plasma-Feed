name: Release

# Push a tag v<build number> (for example v1.261118.0) to build the two files
# for the KDE Store and attach them to a GitHub release:
#   SimpleRSSFeed-1-261118-0.plasmoid  and  SimpleRSSFeed-1-261118-0.tar.gz
# The tag must be the build number of the tagged commit (sh ci/build-version.sh
# <commit>, D-025), which is also the version inside the .plasmoid, and the
# tagged commit must be on main (D-023).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main; tag a commit that is already merged (its CI has run)"
            exit 1
          fi

      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y -q gettext

      - name: Check package and translations
        run: |
          python3 ci/check-package.py
          sh ci/check-translations.sh

      - name: Check tag is the build number of the tagged commit
        run: |
          version=$(sh ci/build-version.sh "${GITHUB_SHA}")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not the build number of its commit (expected v${version}, from sh ci/build-version.sh)"
            exit 1
          fi

      - name: Build .plasmoid and source .tar.gz
        id: build
        run: |
          files=$(sh ci/build-release.sh)
          echo "${files}"
          {
            echo "plasmoid=$(echo "${files}" | sed -n 1p)"
            echo "tarball=$(echo "${files}" | sed -n 2p)"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "${{ steps.build.outputs.plasmoid }}" "${{ steps.build.outputs.tarball }}"
          --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
